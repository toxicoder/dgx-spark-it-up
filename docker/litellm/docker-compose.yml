services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      # PostgreSQL database connection URL for LiteLLM backend storage
      DATABASE_URL: "${DATABASE_URL}"
      # Master key for proxy authentication (must start with sk-)
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Provider API keys for model access
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Optional: Store models in database
      STORE_MODEL_IN_DB: "${STORE_MODEL_IN_DB:-false}"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - litellm_config_data:/app/.litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - litellm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: litellm-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
      # Optional: Persist PostgreSQL configuration
      # - ./postgres-config:/etc/postgresql:ro
    ports:
      # Uncomment to expose PostgreSQL directly (not recommended for production)
      # - "5432:5432"
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  litellm_db_data:
    name: litellm-postgres-data
    driver: local
  litellm_config_data:
    name: litellm-config-data
    driver: local

networks:
  litellm-network:
    name: litellm-network
    driver: bridge